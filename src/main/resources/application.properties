# Configuração do Servidor
server.port=${PORT:8080}

# Configuração do Banco de Dados
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/financeiro_db}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:postgres}}

# HikariCP Tuning
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# Configuração do CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

# Configuração do JPA/Hibernate
# ATENÇÃO: 'validate' validará o schema do banco de dados a cada reinicialização e falhará se houver uma incompatibilidade.
# Para um gerenciamento de schema mais robusto, considere usar Flyway ou Liquibase.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Perfil ativo configurável por variável de ambiente (padrão prod em servidores como Render)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}

# Ativa o log detalhado para o Spring Security
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}

# JWT Configuration
jwt.secret=${JWT_SECRET:ChangeThisSecretToSomethingSecureAndLongEnoughToWorkWithHS256}
jwt.expiration=86400

# Brevo API Configuration (Substitui o SMTP)
brevo.api.key=${BREVO_API_KEY:sua_chave_aqui}

# Multipart upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

app.frontend.url=${FRONTEND_URL:http://localhost:5173}
app.cron.token=${CRON_TOKEN:DefaultCronSecureToken123456!}
spring.main.lazy-initialization=true
app.migration.recalculate-balances=false
